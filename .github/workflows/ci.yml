name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.txt -r discord_bot/requirements.txt
          python -m pip install pytest
      - name: Build (compile)
        run: python -m compileall engine discord_bot memory shared
      - name: Tests
        run: pytest -q
